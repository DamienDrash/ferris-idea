[package]
name = "idecraft-nosql"
description = "Non-relational data sources: MongoDB and Redis sessions, browser tree, consoles, views (ADR-0022)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
idecraft-database.workspace = true
# Default features: rustls TLS with the webpki root certificates (CDLA-Permissive-2.0, allowed by
# the project owner on 2026-11-05, PO-STATUS question 23).
mongodb = "3.10"
redis = { version = "1", default-features = false, features = ["tokio-comp", "tokio-native-tls-comp", "streams"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net"] }
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
