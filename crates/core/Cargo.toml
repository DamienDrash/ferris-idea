[package]
name = "idecraft-core"
description = "IDE lifecycle, layered configuration and workspace model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1"
idecraft-http.workspace = true
# Gitignore rules for the project's own sources (SPEC-0148 v3 behaviour 7): read from the files,
# no git process.
ignore = "0.4"
# The files Git tracks are the project's own even when an ignore rule matches them (SPEC-0148 v4
# behaviour 7): the index is read from the file, no git process. Already in the tree through
# `gix` of idecraft-vcs, same version.
gix-index = { version = "0.55", default-features = false, features = ["sha1"] }
quick-xml = "0.41"
regex = "1"
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[lints]
workspace = true

[target."cfg(unix)".dependencies]
nix = { version = "0.28", default-features = false, features = ["poll", "signal", "user"] }
