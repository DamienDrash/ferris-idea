# Performance budgets of SPEC-0260 (docs/specifications/SPEC-0260-performance-budgets.md), the
# machine-readable form the checks read. A metric above `max` is reported; above
# `max × (1 + tolerance_pct / 100)` CI fails. `bar` names the reference measurement or the
# improvement target the budget comes from. Change budgets only together with the spec.

# --- Typing in a 100 000-line file -------------------------------------------------------------

[[budget]]
metric = "typing_sync_ms_p99"
max = 4.0
tolerance_pct = 50
mode = "headless"
bar = "a quarter of a 60 Hz frame for edit, snapshot and the visible highlight"

[[budget]]
metric = "typing_sync_ms_p50"
max = 1.0
tolerance_pct = 50
mode = "headless"
bar = "typical keystroke leaves the frame almost entirely to layout and paint"

[[budget]]
metric = "typing_background_ms_p95"
max = 500.0
tolerance_pct = 30
mode = "headless"
bar = "colours, problems and folds follow within 0.5 s; the reference drops code insight above 2.5 MB (DOC)"

[[budget]]
metric = "typing_frame_ms_p50"
max = 8.0
tolerance_pct = 50
mode = "window"
bar = "keystroke to painted frame, half a 60 Hz frame"

[[budget]]
metric = "typing_frame_ms_p95"
max = 16.0
tolerance_pct = 25
mode = "window"
bar = "ADR-0003 criterion 2: one 60 Hz frame"

[[budget]]
metric = "typing_frame_ms_p99"
max = 25.0
tolerance_pct = 25
mode = "window"
bar = "no keystroke waits more than one extra frame"

# --- Start, idle and memory (empty project) ----------------------------------------------------

[[budget]]
metric = "start_window_ms"
max = 1000.0
tolerance_pct = 30
mode = "window"
bar = "reference 1.5 s (empty project) / 1.9 s warm (OBS-0002)"

[[budget]]
metric = "start_idle_s"
max = 10.0
tolerance_pct = 20
mode = "window"
bar = "IMP-0063: idle within 10 s of the project window; reference 87-164 s"

[[budget]]
metric = "start_rss_mib"
max = 300.0
tolerance_pct = 10
mode = "window"
bar = "IMP-0003: < 300 MiB; reference 2.2-2.6 GB (OBS-0002)"

[[budget]]
metric = "idle_rss_mib"
max = 300.0
tolerance_pct = 10
mode = "window"
bar = "IMP-0003 after 10 min idle; reference ~3.0 GB (OBS-0001)"

[[budget]]
metric = "idle_growth_mib"
max = 10.0
tolerance_pct = 50
mode = "window"
bar = "IMP-0003: no idle growth"

