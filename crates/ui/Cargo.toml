[package]
name = "ferris-idea-ui"
description = "User interface layer: keymaps now, toolkit per ADR-0003 later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
# The file envelope of the user keymap (`SPEC-0303`).
ferris-idea-core.workspace = true
quick-xml = "0.41"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml.workspace = true

# The shared tooltip view (`SPEC-0294`) needs the UI toolkit; the views' crate turns it on.
[features]
view = ["dep:gpui"]

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "x11", "wayland"], optional = true }

[lints]
workspace = true
