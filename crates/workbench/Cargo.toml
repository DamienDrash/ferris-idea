[package]
name = "ferris-idea-workbench"
description = "Desktop views on GPUI (ADR-0003): the editor view first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND OFL-1.1"
repository.workspace = true
publish.workspace = true

[dependencies]
ferris-idea-ai.workspace = true
# Claude Code connects to the window as its IDE (SPEC-0358).
ferris-idea-claude-link.workspace = true
ferris-idea-core.workspace = true
ferris-idea-containers.workspace = true
ferris-idea-database.workspace = true
ferris-idea-nosql.workspace = true
ferris-idea-debugger.workspace = true
# The semantic tree and the UI driver (ADR-0027, SPEC-0319).
ferris-idea-uidriver.workspace = true
serde.workspace = true
serde_json = "1"
regex = "1"
# Messages of the Docker event watcher and followed logs to the window (SPEC-0119 v5).
async-channel = "2"
# Time zone rules for commit dates (SPEC-0086 v6 behaviour 2a); already in the tree through gix.
jiff = "0.2"
ferris-idea-editor.workspace = true
ferris-idea-formats.workspace = true
ferris-idea-http.workspace = true
ferris-idea-languages.workspace = true
ferris-idea-plugins.workspace = true
ferris-idea-profiler.workspace = true
ferris-idea-remote.workspace = true
ferris-idea-session.workspace = true
ferris-idea-terminal.workspace = true
ferris-idea-vcs.workspace = true
tokio = { workspace = true, features = ["rt"] }
ferris-idea-ui = { workspace = true, features = ["view"] }

# UI toolkit (ADR-0003), same features as the app.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "x11", "wayland"] }
# Own X connection that wakes gpui's event loop until a new window's first frame (x11_wake).
x11rb = { version = "0.13", default-features = false }

[lints]
workspace = true

# Window-free tests of views with the GPUI test platform (window check of #485, D1).
[dev-dependencies]
# The SSH test host runs inside the test process (`ferris_idea_remote::testing`, feature `test-host`).
ferris-idea-remote = { workspace = true, features = ["test-host"] }
duckdb.workspace = true
wat = "1"
# known_hosts lines of the room link window test (SPEC-0323 v7).
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders", "test-support"] }
