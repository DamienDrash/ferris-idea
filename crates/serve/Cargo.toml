[package]
name = "idecraft-serve"
description = "The headless backend of IDECraft: `idecraft serve` without any windowing toolkit (SPEC-0317, SPEC-0321)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "idecraft-serve"
path = "src/main.rs"

[dependencies]
idecraft-core.workspace = true
idecraft-editor.workspace = true
idecraft-host.workspace = true
idecraft-languages.workspace = true
idecraft-mcp = { workspace = true, optional = true }
idecraft-pairing.workspace = true
idecraft-remote.workspace = true
idecraft-session.workspace = true
idecraft-web.workspace = true
# QR codes for pairing (SPEC-0324 behaviour 3; MIT or Apache-2.0).
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }

[features]
# The host's MCP tools (`mcp.*`, `idecraft-serve mcp`). Off for Windows builds: the database stack
# below `idecraft-mcp` does not build there yet (SPEC-0321 behaviour 2).
default = ["mcp"]
mcp = ["dep:idecraft-mcp", "dep:tokio"]

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"

# The backend is copied to hosts that may have no libssl (SPEC-0321 behaviour 6): OpenSSL is
# compiled in on Linux. macOS and Windows use the system TLS through native-tls.
[target."cfg(target_os = \"linux\")".dependencies]
openssl = { version = "0.10", features = ["vendored"] }
