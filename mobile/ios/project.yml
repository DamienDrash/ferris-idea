# The IDECraft iOS app (ADR-0029, SPEC-0326). Generate with `xcodegen`, after
# `scripts/build-mobile.sh ios` has built Generated/. Simulator only: no team, no signing identity.
name: IDECraft
options:
  bundleIdPrefix: dev.idecraft
  deploymentTarget:
    iOS: "17.0"
targets:
  IDECraftMobile:
    type: application
    platform: iOS
    sources:
      - path: IDECraft
      - path: Generated/idecraft_mobile.swift
    dependencies:
      - framework: Generated/IDECraftCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.idecraft.mobile
        PRODUCT_NAME: IDECraft
        MARKETING_VERSION: "0.12.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "IDECraft connects to your paired computer on the local network."
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: "-lc++"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
