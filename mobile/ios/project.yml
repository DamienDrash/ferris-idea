# The Ferris IDEA iOS app (ADR-0029, SPEC-0326). Generate with `xcodegen`, after
# `scripts/build-mobile.sh ios` has built Generated/. Simulator only: no team, no signing identity.
name: FerrisIDEA
options:
  bundleIdPrefix: dev.ferrisidea
  deploymentTarget:
    iOS: "17.0"
targets:
  FerrisIDEAMobile:
    type: application
    platform: iOS
    sources:
      - path: FerrisIDEA
      - path: Generated/ferris_idea_mobile.swift
    dependencies:
      - framework: Generated/FerrisIDEACore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ferrisidea.mobile
        PRODUCT_NAME: FerrisIDEA
        MARKETING_VERSION: "0.12.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Ferris IDEA connects to your paired computer on the local network."
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: "-lc++"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
