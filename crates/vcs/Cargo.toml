[package]
name = "idecraft-vcs"
description = "Version control integration, Git first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
idecraft-core.workspace = true
idecraft-remote.workspace = true
gix = { version = "0.87", default-features = false, features = ["blame", "merge", "status", "revision", "sha1"] }
serde.workspace = true
similar = "3"
thiserror.workspace = true

[target."cfg(unix)".dependencies]
nix = { version = "0.28", default-features = false, features = ["signal"] }

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.28", default-features = false, features = ["signal", "time"] }

[lints]
workspace = true
