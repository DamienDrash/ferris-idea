[package]
name = "idecraft-session"
description = "Session protocol between the window and `idecraft serve`: frames, JSON-RPC, documents with operational transformation, reconnection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.3"
idecraft-core.workspace = true
idecraft-editor.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true

[target."cfg(unix)".dependencies]
# Peer user id of the reattach socket (`getpeereid`, `SO_PEERCRED`) and the own user id.
nix = { version = "0.28", default-features = false, features = ["user", "socket", "fs"] }

[lints]
workspace = true
