[package]
name = "ferris-idea-mobile"
description = "The shared core of the Ferris IDEA mobile apps: pairing and project access over the paired channel, bound to Swift and Kotlin with UniFFI (ADR-0029, SPEC-0326)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `staticlib` for the iOS XCFramework, `cdylib` for Android and for reading the UniFFI metadata.
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# The binding generator, needed only by scripts/build-mobile.sh.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
ferris-idea-pairing.workspace = true
ferris-idea-session.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
uniffi = "0.32"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

# Not `workspace = true`: UniFFI's generated scaffolding is `unsafe`, which the workspace forbids.
# `no_handwritten_unsafe_code` in src/lib.rs keeps the crate's own sources free of it.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
