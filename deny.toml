# Dependency policy: permissive licenses only (the project's legal analysis, 8.3).
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  # Allowed by the project owner on 2026-11-05 (PO-STATUS question 23, "Allow both"): CDLA-Permissive-2.0
  # for the Mozilla root certificates in webpki-roots (rustls TLS of the MongoDB driver),
  # BSL-1.0 for xxhash-rust (redis 1.x).
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

# The allow list above is for dependencies. The workspace's own crates are under the project's
# licence, Apache-2.0 (LICENSE.md, ADR-0038). They are skipped here because they are not
# published (`publish = false` in every manifest).
[licenses.private]
ignore = true

# Narrow exceptions approved by the project owner on 2026-10-31 (PO-STATUS question 3) for the UI toolkit GPUI
# (ADR-0003). Only these crates, only these licences; the allow list above stays unchanged.
[[licenses.exceptions]]
# Build-time only: shader translation through naga.
crate = "hexf-parse"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
# Through image → ravif → rav1e (AVIF encoder); OSI-approved, BSD-like.
crate = "libfuzzer-sys"
allow = ["NCSA"]

[[licenses.exceptions]]
# Linux backends (X11/Wayland) only; approved by the project owner on 2026-10-31 (PO-STATUS question 3).
crate = "tiny-keccak"
allow = ["CC0-1.0"]

# Advisories (checked by scripts/ci-local.sh and CI). A vulnerability is fixed by updating, never
# listed here unless it is demonstrably unreachable. Each entry below was reviewed on 2026-11-09:
# unmaintained, no known vulnerability, no maintained release of the crate that pulls it in.
# GPUI (ADR-0003, gpui 0.2.2 is its newest release) is the reason for most; drop an entry when the
# dependency moves on (cargo-deny then warns that the advisory no longer matches).
[advisories]
ignore = [
  # GPUI's HTTP crate.
  { id = "RUSTSEC-2025-0052", reason = "2026-11-09 async-std: only through zed-async-tar, used by gpui_http_client's GitHub download helper; no Ferris IDEA crate calls gpui_http_client. Goes away only with a GPUI change." },
  { id = "RUSTSEC-2026-0441", reason = "2026-11-09 pin-utils: only through async-std, see RUSTSEC-2025-0052." },
  { id = "RUSTSEC-2025-0134", reason = "2026-11-09 rustls-pemfile: only through zed-reqwest in gpui_http_client; no Ferris IDEA crate calls gpui_http_client. Goes away only with a GPUI change." },
  # Not compiled on any platform we ship.
  { id = "RUSTSEC-2024-0384", reason = "2026-11-09 instant: only through fastrand 1.9 on wasm targets; absent from the macOS, Linux and Windows dependency trees." },
  # Compile-time proc macros: nothing of them is in the binary.
  { id = "RUSTSEC-2024-0436", reason = "2026-11-09 paste: compile-time macro only, through metal, rav1e, pulp (GPUI and its image stack) and oracle 0.6.3, the newest driver release." },
  { id = "RUSTSEC-2026-0173", reason = "2026-11-09 proc-macro-error2: compile-time macro only, through stacksafe-macro in GPUI." },
  # Font shaping and parsing, in the running product. Input is installed system fonts, not project content.
  { id = "RUSTSEC-2026-0206", reason = "2026-11-09 rustybuzz 0.14 and 0.20: through cosmic-text (GPUI, Linux) and usvg 0.45 (GPUI, resvg for ER diagram export). GPUI fixes usvg 0.45, so raising our resvg would not remove it. Revisit if a Ferris IDEA path ever loads fonts from untrusted files." },
  { id = "RUSTSEC-2026-0192", reason = "2026-11-09 ttf-parser 0.20, 0.21 and 0.25: same paths and same limit as RUSTSEC-2026-0206." },
  # Linux desktop integration of GPUI (portals, secret service) and, since 2026-11-10, the Secret
  # Service key store of ferris-idea-pairing (oo7 0.5, the release GPUI uses, so one copy); not built on
  # macOS or Windows. Informational (unmaintained), no known vulnerability. oo7 0.7 is on zbus 6 but
  # needs Rust 1.95 (workspace: 1.89) and would add a second oo7 beside GPUI's; move with GPUI.
  { id = "RUSTSEC-2026-0371", reason = "2026-11-10 zbus_names: through zbus 5 in ashpd and oo7 (GPUI and the pairing key store, Linux only). Merged into zbus 6, which those crates do not use yet." },
  { id = "RUSTSEC-2026-0370", reason = "2026-11-09 zvariant: same path as RUSTSEC-2026-0371." },
  { id = "RUSTSEC-2026-0372", reason = "2026-11-09 zvariant_derive: same path as RUSTSEC-2026-0371." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
