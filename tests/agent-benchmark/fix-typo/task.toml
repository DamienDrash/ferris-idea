id = "fix-typo"
title = "Fix a typo in one file"
prompt = "greeting.txt says \"wrold\". Correct it to \"world\" and change nothing else."
grants = ["write"]
max_tool_calls = 10
max_seconds = 60

[[check]]
file = "greeting.txt"
equals = "expected-greeting.txt"

[[check]]
file = "greeting.txt"
absent = "wrold"

[[check]]
tool = "read_file"
args = { path = "greeting.txt", start_line = 1, end_line = 1 }
pointer = ""
equals = "Hello, world!"
