[package]
name = "ferris-idea-vcs"
description = "Version control integration, Git first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferris-idea-core.workspace = true
ferris-idea-remote.workspace = true
gix = { version = "0.87", default-features = false, features = ["blame", "merge", "status", "revision", "sha1"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
similar = "3"
thiserror.workspace = true

[target."cfg(unix)".dependencies]
nix = { version = "0.28", default-features = false, features = ["signal"] }

[dev-dependencies]
# The SSH test host runs inside the test process (`ferris_idea_remote::testing`, feature `test-host`).
ferris-idea-remote = { workspace = true, features = ["test-host"] }

[target."cfg(unix)".dev-dependencies]
nix = { version = "0.28", default-features = false, features = ["signal", "time"] }

[lints]
workspace = true
