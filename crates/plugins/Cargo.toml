[package]
name = "idecraft-plugins"
description = "Plugins as sandboxed WebAssembly modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
idecraft-core.workspace = true
# TLS the host makes for connector plugins (`SPEC-0314` v2 behaviour 10).
native-tls.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml.workspace = true
wasmi = "2"

[dev-dependencies]
# A TLS server with a test certificate authority (same versions and features as `web`).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
wat = "1"

[lints]
workspace = true
