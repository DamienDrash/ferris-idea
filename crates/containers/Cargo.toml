[package]
name = "ferris-idea-containers"
description = "Docker over the Engine API and Kubernetes through kubectl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferris-idea-remote.workspace = true
serde.workspace = true
serde_json = "1"
# Log search (SPEC-0119 v5 behaviour 10); linear-time matching, already in the workspace.
regex = "1"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios"] }

[dev-dependencies]
ferris-idea-core.workspace = true
# The SSH test host runs inside the test process (`ferris_idea_remote::testing`, feature `test-host`).
ferris-idea-remote = { workspace = true, features = ["test-host"] }

[lints]
workspace = true
