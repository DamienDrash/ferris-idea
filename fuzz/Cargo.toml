# Coverage-guided fuzzing of the M8.2 targets with libFuzzer (nightly): docs/testing/HARDENING.md.
# A workspace of its own, so the nightly-only build never touches the main workspace.
[package]
name = "ferris-idea-fuzz-targets"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
ferris-idea-hardening = { path = "../crates/hardening" }
libfuzzer-sys = "0.4"

[[bin]]
name = "lsp_frame"
path = "fuzz_targets/lsp_frame.rs"
test = false
doc = false
bench = false

