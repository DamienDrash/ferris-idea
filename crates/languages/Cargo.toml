[package]
name = "ferris-idea-languages"
description = "Language identification and language-service integration (LSP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferris-idea-core.workspace = true
ferris-idea-debugger.workspace = true
ferris-idea-ui.workspace = true
sha2 = "0.10"
flate2 = "1"
serde.workspace = true
serde_json = "1"
quick-xml = "0.41"
toml.workspace = true
thiserror.workspace = true
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-containerfile = "0.9"
tree-sitter-groovy = "0.1"
tree-sitter-scala = "0.26"
tree-sitter-scss = "1.0"
tree-sitter-swift = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-r = "1.3"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-less = "1.0"
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tree-sitter-kotlin-ng = "1.1.0"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
